<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCE CampusTrack</title><style>
body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.box{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #0001}input,button{padding:11px;border-radius:9px;border:1px solid #ddd;font:inherit}button{cursor:pointer}.primary{background:#315efb;color:white;border:0}.tabs button{margin:4px}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:650px){.grid{grid-template-columns:2fr 2fr}}
</style></head><body><div id="login" class="box"><div class="card"><h1>🎓 NCE CampusTrack</h1><p>Student Attendance & Record Management System</p>
<button class="primary" onclick="role='faculty';drawLogin()">Faculty</button> <button onclick="role='student';drawLogin()">Student</button><div id="lf"></div></div></div>
<div id="main" class="box hidden"></div><script>
let role='faculty';
function drawLogin(){lf.innerHTML=role==='faculty'?'<p>Faculty password</p><input id="x" type="password" placeholder="Password"> <button class="primary" onclick="login()">Login</button>':'<p>Student roll number</p><input id="x" placeholder="Roll number"> <button class="primary" onclick="login()">Login</button>'}
async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){try{await api(role==='faculty'?'/api/login/faculty':'/api/login/student',{method:'POST',body:JSON.stringify(role==='faculty'?{password:x.value}:{roll:x.value})});login.className='';document.getElementById('login').classList.add('hidden');main.classList.remove('hidden');role==='faculty'?faculty():student()}catch(e){alert(e.message)}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
async function faculty(){main.innerHTML='<h1>Faculty Dashboard</h1><button onclick="logout()">Logout</button><div class="tabs"><button onclick="students()">Students</button><button onclick="attendance()">Attendance</button><button onclick="settings()">Password</button></div><div id="view"></div>';students()}
async function students(){let d=await api('/api/students');view.innerHTML='<div class="card"><h2>Students</h2><p><input id="search" placeholder="Search" oninput="filter()"></p><table><thead><tr><th>Roll</th><th>Name</th><th>Branch</th><th>Semester</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card"><h3>Add Student</h3><input id="r" placeholder="Roll"> <input id="n" placeholder="Name"> <input id="b" placeholder="Branch"> <input id="s" placeholder="Semester"> <button class="primary" onclick="add()">Add</button></div>';window.S=d.students;filter()}
function filter(){let q=(search?.value||'').toLowerCase();rows.innerHTML=window.S.filter(x=>(x.roll+' '+x.name+' '+x.branch).toLowerCase().includes(q)).map(x=>`<tr><td>${x.roll}</td><td>${x.name}</td><td>${x.branch||''}</td><td>${x.semester||''}</td></tr>`).join('')}
async function add(){await api('/api/students',{method:'POST',body:JSON.stringify({roll:r.value,name:n.value,branch:b.value,semester:s.value})});students()}
async function attendance(){let day=new Date().toISOString().slice(0,10);let d=await api('/api/attendance?day='+day);view.innerHTML='<div class="card"><h2>Attendance — '+day+'</h2><table><tr><th>Roll</th><th>Name</th><th>Status</th></tr>'+d.records.map(x=>`<tr><td>${x.roll}</td><td>${x.name}</td><td><button onclick="mark('${x.roll}','P')">P</button> <button onclick="mark('${x.roll}','A')">A</button> <button onclick="mark('${x.roll}','L')">L</button> ${x.status||''}</td></tr>`).join('')+'</table></div>'}
async function mark(roll,status){await api('/api/attendance',{method:'POST',body:JSON.stringify({roll,status,day:new Date().toISOString().slice(0,10)})});attendance()}
async function settings(){view.innerHTML='<div class="card"><h2>Change Faculty Password</h2><input id="old" type="password" placeholder="Current"> <input id="nw" type="password" placeholder="New"> <button class="primary" onclick="chg()">Update</button></div>'}
async function chg(){try{await api('/api/change-password',{method:'POST',body:JSON.stringify({old:old.value,new:nw.value})});alert('Password updated')}catch(e){alert(e.message)}}
async function student(){let d=await api('/api/me/student');main.innerHTML='<h1>🎓 NCE CampusTrack</h1><button onclick="logout()">Logout</button><div class="card"><h2>'+d.student.name+'</h2><p>Roll: '+d.student.roll+' · '+(d.student.branch||'')+'</p><h1>'+d.percentage+'%</h1><p>Attendance</p></div><div class="card"><h2>History</h2><table><tr><th>Date</th><th>Subject</th><th>Status</th></tr>'+d.records.map(x=>'<tr><td>'+x.day+'</td><td>'+x.subject+'</td><td>'+x.status+'</td></tr>').join('')+'</table></div>'}
drawLogin();
</script></body></html>
